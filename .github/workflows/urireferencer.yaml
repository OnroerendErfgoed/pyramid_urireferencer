name: Urireferencer backend tests

on:
  workflow_dispatch:

  pull_request:
    paths:
      - pyramid_urireferencer/**
      - .github/workflows/pyramid_urireferencer.yaml
      - scripts/**
      - pyproject.toml
      - requirements*.txt
      - tests/**

  push:
    branches:
      - main
env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install python requirements
        env:
          HATCH_BUILD_NO_HOOKS: true
        working-directory: ./
        run: |
          pip --version
          pip install pip-tools
          pip-sync requirements-dev.txt
          pip install -e .

      - name: Python tests
        run: pytest --cov-report xml:${{ runner.temp }}/coverage.xml --cov=pyramid_urireferencer tests --exitfirst --capture=no -vvv --full-trace

      - name: Get Cover
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: ${{ runner.temp }}/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.8
          thresholdNew: 0.9
          thresholdModified: 0.8
